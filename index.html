<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary SEO Meta Tags -->
        <title>AfriSci Nexus — African Scientific Excellence Platform</title>
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/689712620d81bb990dd76bb3/698e59606_generated_image.png" />
    <meta name="title" content="AfriSci Nexus | African Open Access Peer-Reviewed Journals & Research Platform" />
    <meta name="description" content="AfriSci Nexus is Africa's leading open-access academic publishing platform. Submit manuscripts, read peer-reviewed research across STEM, medicine, social sciences, law, agriculture and more. Serving 54 African countries with 10,000+ published articles." />
    <meta name="keywords" content="African journals, open access research, peer reviewed journals Africa, African scientific publications, academic publishing Africa, STEM journals Africa, medical research Africa, submit manuscript Africa, AfriSci Nexus, African scholars, research papers Africa, African science" />
    <meta name="author" content="AfriSci Nexus Editorial Team" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="revisit-after" content="3 days" />
    <meta name="language" content="English" />
    <meta name="rating" content="general" />
    <link rel="canonical" href="https://afrisco-nexus.base44.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://afrisco-nexus.base44.app/" />
    <meta property="og:site_name" content="AfriSci Nexus" />
    <meta property="og:title" content="AfriSci Nexus | African Open Access Peer-Reviewed Journals" />
    <meta property="og:description" content="Africa's leading open-access academic publishing platform. 50+ peer-reviewed journals, 10,000+ articles, serving 54 African countries. Submit your research today." />
    <meta property="og:image" content="https://afrisco-nexus.base44.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AfriSci Nexus - African Scientific Excellence Platform" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@AfriSciNexus" />
    <meta name="twitter:creator" content="@AfriSciNexus" />
    <meta name="twitter:title" content="AfriSci Nexus | African Open Access Peer-Reviewed Journals" />
    <meta name="twitter:description" content="Africa's leading open-access academic publishing platform. 50+ peer-reviewed journals, 10,000+ articles, 54 countries." />
    <meta name="twitter:image" content="https://afrisco-nexus.base44.app/og-image.png" />

    <!-- Geo Targeting -->
    <meta name="geo.region" content="AF" />
    <meta name="geo.placename" content="Africa" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1E40AF" />
    <meta name="msapplication-TileColor" content="#1E40AF" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- JSON-LD Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "AfriSci Nexus",
      "alternateName": "African Scientific Excellence Platform",
      "url": "https://afrisco-nexus.base44.app",
      "logo": "https://afrisco-nexus.base44.app/favicon.svg",
      "description": "Africa's leading open-access academic publishing platform serving 54 African countries with peer-reviewed research across all scientific disciplines.",
      "foundingDate": "2024",
      "areaServed": "Africa",
      "sameAs": [
        "https://twitter.com/AfriSciNexus",
        "https://www.linkedin.com/company/afrisci-nexus"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "editorial",
        "email": "editorial@afrisco-nexus.base44.app",
        "availableLanguage": ["English", "French", "Arabic", "Portuguese", "Swahili"]
      }
    }
    </script>

    <!-- JSON-LD Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AfriSci Nexus",
      "url": "https://afrisco-nexus.base44.app",
      "description": "African Open Access Peer-Reviewed Academic Publishing Platform",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://afrisco-nexus.base44.app/Publications?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD Structured Data: AcademicJournal / Periodical -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Periodical",
      "name": "AfriSci Nexus Journals",
      "publisher": {
        "@type": "Organization",
        "name": "AfriSci Nexus"
      },
      "inLanguage": ["en", "fr", "ar", "pt", "sw"],
      "isAccessibleForFree": true,
      "accessMode": ["textual", "visual"],
      "accessibilityFeature": ["readingOrder", "structuralNavigation"],
      "audience": {
        "@type": "Audience",
        "audienceType": "Researchers, Scientists, Academics"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
